services:
  - type: web
    name: familyfinance
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyfinance-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Opcional: asistente con IA real y escaneo de boletas (gratis en
      # https://aistudio.google.com/apikey). Sin esta clave, ambas funciones
      # operan en modo degradado en vez de fallar.
      - key: GEMINI_API_KEY
        sync: false
      # Opcional: notificaciones push. Par de claves autogenerado (no
      # depende de ninguna cuenta externa) — ver backend/.env.example.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: familyfinance-db
    plan: free
    databaseName: familyfinance
    user: familyfinance
