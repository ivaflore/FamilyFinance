services:
  - type: web
    name: familyfinance
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyfinance-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: familyfinance-db
    plan: free
    databaseName: familyfinance
    user: familyfinance
