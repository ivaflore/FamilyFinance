services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familyfinance
      POSTGRES_PASSWORD: familyfinance
      POSTGRES_DB: familyfinance
    ports:
      - '5432:5432'
    volumes:
      - familyfinance-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familyfinance']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://familyfinance:familyfinance@postgres:5432/familyfinance
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  familyfinance-db:
